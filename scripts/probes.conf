# Which ST-LINK probe belongs to which app. Read by scripts/probe.sh, which
# scripts/console.sh and scripts/flash.sh use to stop guessing once both Nucleos
# are plugged in at the same time.
#
#   <app name>  <ST-LINK serial number>
#
# The serial is burned into the probe and never changes, unlike the
# /dev/cu.usbmodem* name, which is derived from the USB topology and moves when
# you use a different port or hub. That is the whole reason this file keys on
# serials.
#
# This is bench-specific, and it is committed for the same reason the static IPs
# in gateway/prj.conf are: this repo describes one particular bench, and a
# reader is better served by the real numbers than by a placeholder. On a
# different bench, run `scripts/probe.sh` with the boards attached -- it prints
# every probe it can see, and flags any that this file does not know about --
# then paste the serials in here.
#
# Nothing breaks without it. With a single probe attached the scripts use it
# without asking, and STLINK_SERIAL= overrides this file at any time.

gateway     0052003D3335510235383531   # Nucleo-H753ZI, ST-LINK/V3E
peer-node   066DFF363732594D43162633   # Nucleo-F072RB, ST-LINK/V2-1
