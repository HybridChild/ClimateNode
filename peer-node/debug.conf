# An interactive shell on the peer node, for bench work only.
#
# Not part of prj.conf, because this is a build *variant* rather than a change
# of mind. Pass it explicitly:
#
#   ./scripts/build.sh -a peer-node --debug -p
#
# which expands to -DEXTRA_CONF_FILE=debug.conf. Kconfig merges the fragments in
# order, so everything below is layered on top of prj.conf rather than replacing
# it -- see notes/zephyr-build-system-guide.md for how that merge works.
#
# ---------------------------------------------------------------------------
# Why this is not simply on
# ---------------------------------------------------------------------------
#
# Measured on this app, all four pristine builds, RAM out of 16 KB:
#
#   no shell (prj.conf alone)          10 696 B   65 %     67 384 B flash
#   shell core, stock settings         15 632 B   95 %     97 008 B
#   + can shell, stock settings        16 092 B   98 %    106 268 B
#   + sensor shell, stock settings     OVERFLOW by 5856 B
#   this file (trimmed, + can shell)   13 532 B   83 %     98 680 B
#
# A stock Zephyr shell essentially consumes the part: 95 % of RAM before a
# single command set is added. The trimming below is what makes it usable, and
# every line of it costs a convenience you would otherwise have.
#
# CONFIG_SENSOR_SHELL is absent and cannot be added. It selects SENSOR_ASYNC_API,
# which pulls in RTIO and its pools, and the link overflows by 5856 B. Read the
# BME280 through the telemetry stream instead -- which is the honest test
# anyway, since that is the path that has to work.

CONFIG_SHELL=y

# The `can` command set: show, start/stop, mode, bitrate, send, filter add,
# dump. This is the reason to build this variant at all. Having it on BOTH ends
# of the link is what makes a first real-bus bring-up tractable: `can show` on
# each node reports its own error counters and state, so "which end is unhappy"
# stops being a guess. 9272 B of flash and 460 B of RAM.
CONFIG_CAN_SHELL=y

# --- the trimming -----------------------------------------------------------
# Roughly 2.5 KB of RAM, itemised so each cost is visible rather than folded
# into one number.

# 1024 rather than 2048. The deepest thing the shell does here is can_shell.c's
# frame printing; it does no networking and no file I/O.
CONFIG_SHELL_STACK_SIZE=1024

# 96-byte command line rather than 256. The longest command worth typing is
# about `can filter add can@40006400 0x702 0x7ff`, which is 42 characters.
CONFIG_SHELL_CMD_BUFF_SIZE=96

# No history: 512 B of RAM for the up-arrow. The single most missed one, and
# the single largest saving.
CONFIG_SHELL_HISTORY=n

# No tab completion, no VT100 line editing, no colours, no metakeys, no
# statistics. Each keeps its own buffers or tables. What remains is a plain
# line-at-a-time terminal -- type it correctly, press enter.
CONFIG_SHELL_TAB=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_METAKEYS=n
CONFIG_SHELL_STATS=n

# Log lines keep going straight to the UART backend rather than being routed
# through the shell, which would want its own message queue on top of the
# deferred-logging one prj.conf already pays for. The visible effect is that a
# log line can land in the middle of what you are typing. With no history and no
# VT100 there is no redraw to fix that; it is the same trade as the rest.
CONFIG_SHELL_LOG_BACKEND=n

# Small ring buffers. 16 bytes of RX is four characters of typing ahead of the
# shell thread, which a human cannot outrun.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=16
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=16
