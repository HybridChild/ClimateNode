# Ztest, C++, and the bus commands.cpp publishes to.
CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# The nanopb runtime (pb_encode.c / pb_decode.c and pb.h). The CMakeLists
# generates node.pb.c from the schema; this is what it links against.
CONFIG_NANOPB=y
CONFIG_ZBUS=y

# Names in assertion output and in any bus diagnostics.
CONFIG_ZBUS_CHANNEL_NAME=y

# Logging stays ON, and not by choice: CONFIG_TEST_LOGGING_DEFAULTS (default y
# under CONFIG_TEST) does `select LOG`, and a select is a forced enable that
# CONFIG_LOG=n cannot override -- see notes/zephyr-build-system-guide.md §5.1.
# It earns its place anyway: the log line before a failed assertion is the
# context you want. Several tests below deliberately feed rejectable input, so
# expect W:/E: lines from paths that are working correctly. Set
# CONFIG_TEST_LOGGING_DEFAULTS=n for silence.
