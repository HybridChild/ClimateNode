# Ztest, and C++ because can_link.h is C++ (constexpr, scoped enum base types).
CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Nothing else. This suite deliberately links no subsystem at all -- that it
# CAN is the evidence that the link contract has no dependencies, which is what
# lets both applications and this test agree on one definition of the frame.
