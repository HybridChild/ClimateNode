# Wire-format unit tests. No hardware, no network, no sensor.
#
# qemu_cortex_m3 is the platform that matters on this bench: native_sim is
# Linux-only and development happens on macOS. It is listed anyway so a Linux CI
# runner can use it, where it is considerably faster than emulation.
#
# The float fields go through soft-float both here and on the STM32H7: the M3
# has no FPU, and although the H7's Cortex-M7 does, this app leaves CONFIG_FPU
# unset, so both link the same __aeabi_* helpers. native_sim uses the host FPU
# instead, and IEEE-754 is what keeps the encoded bytes identical there -- the
# same guarantee that would cover the H7 if CONFIG_FPU were ever enabled.
common:
  tags:
    - unit
    - protocol
tests:
  node.protocol:
    platform_allow:
      - qemu_cortex_m3
      - native_sim
