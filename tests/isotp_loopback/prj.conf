# Ztest and C++, as every suite here.
CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# The CAN driver and the segmentation layer above it. CONFIG_CAN_LOOPBACK needs
# no line of its own: it is `default y` once the devicetree node in
# boards/qemu_cortex_m3.overlay exists.
CONFIG_CAN=y
CONFIG_ISOTP=y

# zbus is here only because relay.h includes zbus.h for its ZBUS_CHAN_DECLAREs,
# and this suite includes relay.h for one constant (kRelayUpMax). Nothing below
# publishes or observes anything. Same arrangement as tests/relay/.
CONFIG_ZBUS=y

# --- Match the gateway, deliberately ----------------------------------------
#
# The ISO-TP receive pool is left at its defaults -- CONFIG_ISOTP_RX_BUF_COUNT=4
# of CONFIG_ISOTP_RX_BUF_SIZE=56, so 224 bytes -- because that is what
# firmware/prj.conf leaves it at, and the largest thing the gateway must
# reassemble is a 1 + node_Ack_size payload of 141 bytes. Setting them here
# would test a configuration no board runs.
#
# That coupling is the point rather than an accident: sensor-node/prj.conf trims
# the count to 2 (112 bytes) to fit 16 KB of RAM, which is ample for the 21-byte
# commands the peer receives and would silently truncate an Ack. The direction
# each node has to reassemble is what makes the two settings both correct, and
# test_worst_case_upward_payload_round_trips below is what would catch someone
# copying the peer's number onto the gateway.

# ISO-TP drives the frame-by-frame half of every transfer from the shared system
# workqueue, so the same bump firmware/prj.conf makes applies here.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Two 161-byte payload buffers plus a can_frame land on the test thread's stack.
CONFIG_MAIN_STACK_SIZE=2560
CONFIG_ZTEST_STACK_SIZE=2560
