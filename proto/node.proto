// Wire contract between the sensor node and the host harness.
//
// THIS FILE IS THE SINGLE SOURCE OF TRUTH. Firmware and host both generate from
// it; never hand-edit generated code. Firmware generates node.pb.c/.h at build
// time (firmware/CMakeLists.txt); the host runs host/generate.sh.
//
// This file is the decisions half of the Protobuf documentation: the rationale
// lives inline in the comments below. For the concepts from first principles --
// varints, wire types, why field numbers are permanent, what nanopb's .options
// buys -- see notes/protobuf-guide.md. For how the payload sits under MQTT, see
// notes/communication-guide.md.
//
// Field numbers 1-15 encode their tag in a single byte, 16+ take two. Telemetry
// is the high-rate message, so its fields are kept inside that range.
//
// Evolution rules:
//   - NEVER change or reuse a field number.
//   - Deleting a field means `reserved`-ing its number, not freeing it.
//   - Adding a field is always safe; old readers skip what they do not know.
//   - Adding `optional` to an existing scalar is also safe on the wire: the
//     tag and wire type are unchanged, so old and new readers parse each
//     other's bytes. What changes is only whether a *default* value is
//     transmitted at all -- see the note on the Telemetry measurements below.

syntax = "proto3";

package node;

// ---------------------------------------------------------------------------
// Telemetry: node -> host, published on node/<id>/telemetry at QoS 0.
// ---------------------------------------------------------------------------

enum SensorStatus {
  // proto3 requires the zero value to be first; it is also what a decoder
  // yields when the field is absent, so it must mean "no information".
  SENSOR_STATUS_UNSPECIFIED = 0;
  SENSOR_STATUS_OK = 1;
  // The SCD-40 needs a warm-up before its first valid conversion.
  SENSOR_STATUS_WARMING_UP = 2;
  SENSOR_STATUS_ERROR = 3;
}

message Telemetry {
  // Bumped only on a BREAKING change. Additive changes do not touch it —
  // protobuf already handles those, per the evolution rules above.
  uint32 schema_version = 1;

  // Monotonic counter of *readings taken*, assigned by the sensor thread — not
  // of messages published. A gap therefore means "you missed one" for any of
  // three reasons: QoS 0 dropped the publish, the node was disconnected when
  // the reading was taken, or the zbus channel overwrote it before the MQTT
  // thread got to it. All three are the same fact to the host, which is the
  // whole reason telemetry carries a sequence at all.
  uint32 sequence = 2;

  // Milliseconds since boot. Wraps after ~49.7 days; the host must treat a
  // decrease as a reboot rather than assuming monotonicity.
  uint32 uptime_ms = 3;

  // The measurements. All four are `optional` — proto3's *explicit presence* —
  // and the header fields above deliberately are not. The distinction is
  // exactly the one the field means: a measurement can be genuinely absent
  // (this node has no such sensor, or the read failed), whereas a node always
  // has a sequence and an uptime.
  //
  // Without explicit presence a scalar's default is indistinguishable from its
  // absence: a decoder cannot tell "0 ppm" from "no CO2 sensor here", and it
  // reports 0 either way. That was harmless with one node measuring all three;
  // with a second node measuring pressure and no CO2, it is a lie the host has
  // no way to detect. `optional` makes the encoder emit the field whenever the
  // sender set it — zero included — and gives the decoder a has_-bit to ask.
  //
  // The cost is real and worth naming: an explicitly-set zero now occupies
  // bytes it used to be free to omit, so proto3's "defaults are free" property
  // applies only to what is genuinely unset. See notes/protobuf-guide.md §5.
  optional uint32 co2_ppm = 4;
  optional float temperature_c = 5;
  optional float humidity_rh = 6;

  SensorStatus sensor_status = 7;

  // Pascals, not kilopascals or a float. Zephyr's SENSOR_CHAN_PRESS gives
  // kPa in a {val1, val2} pair, and `val1 * 1000 + val2 / 1000` converts to
  // whole pascals exactly — no rounding, and no soft-float on the M0 peer that
  // produces it. Atmospheric pressure spans roughly 30 000–110 000 Pa, so a
  // uint32 is ample and 1 Pa resolution is finer than the sensor's accuracy.
  //
  // Field 8 keeps Telemetry inside the 1-15 single-byte-tag budget.
  optional uint32 pressure_pa = 8;
}

// ---------------------------------------------------------------------------
// Command: host -> node, published on node/<id>/command at QoS 1.
// ---------------------------------------------------------------------------

message SetInterval {
  uint32 interval_ms = 1;
}

// Deliberately empty: the message's presence in the oneof IS the instruction.
// Empty messages are cheap (zero bytes of payload) and leave room to add
// parameters later without changing the command's identity.
message TriggerMeasurement {}

message GetDeviceInfo {}

message Command {
  uint32 schema_version = 1;

  // Echoed back in Ack.sequence. QoS 1 is "at least once", so the node WILL
  // see duplicates after a lost PUBACK; this is what it dedupes on.
  uint32 sequence = 2;

  // A oneof is a tagged union: exactly one member is set, and nanopb generates
  // a `which_payload` discriminator alongside the union. Numbers start at 10 to
  // leave 3-9 free for future header-ish fields that apply to every command.
  oneof payload {
    SetInterval set_interval = 10;
    TriggerMeasurement trigger_measurement = 11;
    GetDeviceInfo get_device_info = 12;
  }
}

// ---------------------------------------------------------------------------
// Ack: node -> host, published on node/<id>/ack at QoS 1.
// ---------------------------------------------------------------------------

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  ACK_STATUS_OK = 1;
  // The command decoded, but its arguments were out of range.
  ACK_STATUS_INVALID_ARGUMENT = 2;
  // The command decoded, but this firmware has no handler for it — the
  // expected outcome when the host is newer than the node.
  ACK_STATUS_UNSUPPORTED = 3;
  // The command was understood and attempted, but failed.
  ACK_STATUS_FAILED = 4;
  // The payload did not decode as a Command at all.
  //
  // Catches corrupt *framing* only. Protobuf has no magic number and no
  // checksum, so a payload that is well-formed but wrong decodes cleanly into
  // zeroed fields and looks like a valid command — verified on the bench: the
  // ASCII "garbage" was rejected only because its first byte encodes wire type
  // 7, which is invalid. Bytes that happen to be structurally legal would pass.
  // That gap is what schema_version is for; MALFORMED cannot cover it.
  ACK_STATUS_MALFORMED = 5;
}

message DeviceInfo {
  string firmware_version = 1;
  string board = 2;
  string client_id = 3;
}

message Ack {
  uint32 schema_version = 1;

  // Copied from the Command being acknowledged, so the host can correlate.
  uint32 sequence = 2;

  AckStatus status = 3;

  // Human-readable context for a failure. Diagnostics only — hosts must
  // branch on `status`, never on this text.
  string detail = 4;

  // Populated only in response to GetDeviceInfo. In proto3 a message field is
  // genuinely optional: absence is distinguishable from an empty message.
  DeviceInfo device_info = 5;
}
