# C++ application (C++17). Exceptions/RTTI stay off (Zephyr defaults) and the
# minimal C++ runtime is kept — see notes/language-cpp.md.
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Sensor subsystem + I2C bus (SCD-40 on I2C1). CONFIG_SCD4X is default-y once the
# devicetree node exists, so it needs no explicit enable here.
CONFIG_SENSOR=y
CONFIG_I2C=y

# Read the sensor on demand from the shell (`sensor get scd40@62`) instead of
# polling in main(). Note this selects SENSOR_ASYNC_API, so the shell reads via
# the RTIO path; scd4x implements only the classic sample_fetch/channel_get, so
# it falls back to __sensor_default_decoder (drivers/sensor/default_rtio_sensor.c),
# which calls those same driver ops underneath.
CONFIG_SENSOR_SHELL=y

# printf() to the ST-LINK VCP console. CBPRINTF_FP_SUPPORT gives %f, which the
# sensor shell also needs to print sensor_value as decimals (it selects it too).
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Networking -------------------------------------------------------------
# The MAC + LAN8742 PHY are already wired in the board devicetree (&mac status
# = "okay" + an eth_phy node), so ETH_STM32_HAL enables itself (default y on
# DT_HAS_ST_STM32_ETHERNET_ENABLED) and pulls in NOCACHE_MEMORY for the H7's DMA
# descriptors. The hardware side needs nothing here.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

# net_config applies the static address at boot (NET_CONFIG_AUTO_INIT is default
# y), so no app code is needed to bring the interface up. Direct cable to the Pi
# at 192.168.10.1 on the same /24 => every peer is on-link => NO gateway.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
# The broker (Mosquitto on the Pi). Kept here so every address lives in one file.
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.10.1"

# --- MQTT client ------------------------------------------------------------
# MQTT 3.1.1 over TCP. Sockets + TCP are what mqtt_lib builds on; see
# docs/mqtt-design.md for the topic/QoS decisions this implements.
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_MQTT_LIB=y

# --- CAN --------------------------------------------------------------------
# The link to the F072RB peer node. Kconfig only: the board's own devicetree
# already enables fdcan1 on PD0/PD1 and points `chosen { zephyr,canbus }` at it,
# so unlike the SCD-40 there is no node for us to add -- only a bitrate, which
# the board dts does NOT set. See docs/can-bringup.md.
CONFIG_CAN=y
# `can` shell commands: mode, start, bitrate, send, dump, add (rx filter). This
# is what makes the link verifiable with no application code at all -- both in
# internal loopback before a transceiver exists, and against the real bus after.
CONFIG_CAN_SHELL=y

# --- Protobuf ---------------------------------------------------------------
# nanopb encodes/decodes the messages in proto/node.proto. The generated structs
# are fixed-size (every variable-length field is bounded in node.options), so no
# allocator is pulled in.
CONFIG_NANOPB=y

# --- zbus (internal thread-to-thread bus) -----------------------------------
# Decouples the sensor thread from the MQTT thread; see src/app_channels.h.
CONFIG_ZBUS=y
# Names cost a few bytes of ROM each and make zbus's own log lines readable.
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y

# Message subscribers get a *copy* of every message in order, which is what the
# command channel needs (a dropped command has no next one coming). Telemetry
# uses a plain listener instead, so this pool only ever holds sensor commands.
CONFIG_ZBUS_MSG_SUBSCRIBER=y
# Fixed-size pool rather than the system heap: same no-allocator policy as
# nanopb above. One struct sensor_cmd is 8 bytes.
CONFIG_ZBUS_PREFER_DYNAMIC_ALLOCATION=n
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=16
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=4

# eventfd: a file descriptor the sensor side can signal and zsock_poll() can
# wait on, so the MQTT loop blocks on the socket and the bus in one call
# instead of waking on a timer to check the bus.
CONFIG_ZVFS=y
CONFIG_ZVFS_EVENTFD=y

# Shell + net shell: `net iface` shows link state/IP/MAC and `net ping` sends
# ICMP from the board — that is how we prove the Nucleo -> Pi direction.
CONFIG_SHELL=y
CONFIG_NET_SHELL=y

# Log the driver's link up/down and the MAC it derives from the STM32 unique ID.
CONFIG_LOG=y
CONFIG_NET_LOG=y

CONFIG_MAIN_STACK_SIZE=2048
