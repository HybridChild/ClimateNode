# C++ application (C++17). Exceptions/RTTI stay off (Zephyr defaults) and the
# minimal C++ runtime is kept — see docs/language-cpp.md.
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Sensor subsystem + I2C bus (SCD-40 on I2C1). CONFIG_SCD4X is default-y once the
# devicetree node exists, so it needs no explicit enable here.
CONFIG_SENSOR=y
CONFIG_I2C=y

# printf() to the ST-LINK VCP console, with %f support for sensor_value_to_double().
CONFIG_STDOUT_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Networking -------------------------------------------------------------
# The MAC + LAN8742 PHY are already wired in the board devicetree (&mac status
# = "okay" + an eth_phy node), so ETH_STM32_HAL enables itself (default y on
# DT_HAS_ST_STM32_ETHERNET_ENABLED) and pulls in NOCACHE_MEMORY for the H7's DMA
# descriptors. The hardware side needs nothing here.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

# net_config applies the static address at boot (NET_CONFIG_AUTO_INIT is default
# y), so no app code is needed to bring the interface up. Direct cable to the Pi
# at 192.168.10.1 on the same /24 => every peer is on-link => NO gateway.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Shell + net shell: `net iface` shows link state/IP/MAC and `net ping` sends
# ICMP from the board — that is how we prove the Nucleo -> Pi direction.
CONFIG_SHELL=y
CONFIG_NET_SHELL=y

# Log the driver's link up/down and the MAC it derives from the STM32 unique ID.
CONFIG_LOG=y
CONFIG_NET_LOG=y

CONFIG_MAIN_STACK_SIZE=2048
