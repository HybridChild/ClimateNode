# The F072RB peer node. 16 KB of RAM and 128 KB of flash, so every option here
# is one someone had to justify -- unlike the gateway, where the H7's 512 KB
# made the question uninteresting. Where a value differs from firmware/prj.conf,
# the comment says why.

# C++17, same as the gateway. See notes/language-cpp.md.
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# --- Sensor -----------------------------------------------------------------
# BME280 on I2C1. CONFIG_BME280 is default-y once the devicetree node exists,
# so the driver needs no explicit enable -- the same devicetree->Kconfig bridge
# the SCD-40 uses on the gateway (docs/build-system-overview.md).
CONFIG_SENSOR=y
CONFIG_I2C=y

# --- CAN --------------------------------------------------------------------
# bxCAN, classic CAN 2.0B. No CONFIG_CAN_FD_MODE: this part cannot do CAN-FD at
# all, which is what fixes the link at 8 payload bytes and makes the next
# option necessary rather than a convenience.
CONFIG_CAN=y

# ISO-TP (ISO 15765-2): segmentation and reassembly on top of 8-byte frames,
# with flow control. A Telemetry is up to 43 bytes with its type prefix, so it
# does not fit a single frame and there is no way around this. notes/can-guide.md §8.
CONFIG_ISOTP=y

# Trim the ISO-TP receive pools. The defaults are 4 of each, sized for a node
# handling several concurrent transfers; this one only ever receives a Command,
# and 4x56 B twice over is real money on 16 KB.
CONFIG_ISOTP_RX_BUF_COUNT=2
CONFIG_ISOTP_RX_SF_FF_BUF_COUNT=2

# There is deliberately no CONFIG_ISOTP_TX_BUF_COUNT here: it depends on
# ISOTP_USE_TX_BUF, and setting it without that produces a Kconfig warning and
# no effect. We do not want the TX buffers at all. main.cpp calls isotp_send()
# with a null completion callback, which blocks until the whole segmented
# transfer has finished, so the caller's own buffer stays valid for the
# duration and there is nothing for the library to copy into. That is also what
# makes the single-writer rule enforceable without a mutex -- see src/main.cpp.
# CONFIG_ISOTP_USE_TX_BUF is not set
# CONFIG_ISOTP_ENABLE_CONTEXT_BUFFERS is not set

# --- Protobuf ---------------------------------------------------------------
# Same generated code as the gateway, from the same proto/node.proto.
CONFIG_NANOPB=y

# --- zbus -------------------------------------------------------------------
# Same split as the gateway: the sensor thread publishes readings and never
# mentions CAN. See firmware/src/app_channels.h.
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_PREFER_DYNAMIC_ALLOCATION=n
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=16
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=2

# Channel and observer names cost ROM per object and only ever appear in zbus's
# own log lines. The gateway keeps them; this node does not.
# CONFIG_ZBUS_CHANNEL_NAME is not set
# CONFIG_ZBUS_OBSERVER_NAME is not set

# --- Console and logging ----------------------------------------------------
# usart2 on the ST-LINK VCP at 115200, from the board dts. Deliberately NO
# shell: CONFIG_SHELL, CONFIG_SENSOR_SHELL and CONFIG_CAN_SHELL are all off.
# can_shell.c alone was 4356 B of the gateway's flash, and a shell wants a
# thread and a stack this part would rather spend elsewhere. Debug this node
# from the gateway's console and the bus, which is also how it will have to be
# debugged once it is not on a desk.
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
# Deferred logging, and NOT CONFIG_LOG_MODE_MINIMAL, which is what this file
# tried first. Minimal mode routes every message straight to vprintk() in the
# caller's context (subsys/logging/log_minimal.c:19) with nothing owning the
# output, so two threads logging at once interleave *within a line*. Observed on
# this board, at the worst possible moment -- boot, when both threads have
# something to say:
#
#   I: BME280 W: gateway unreachable (heartbeat failed: -5) — backing off
#   online
#
# That is two correct messages and one unreadable console. CONFIG_PRINTK_SYNC=y
# would fix it with a spinlock, but a spinlock on a single-core part is an
# irq_lock held for the whole line, and a 60-character line over a polling UART
# at 115200 is about 5 ms of interrupts disabled -- twenty CAN frame times, on a
# controller with a three-deep RX FIFO.
#
# So: a log thread and a ring buffer instead. It costs +1640 B RAM and +8748 B
# flash, taking this app to 65 % and 51 % of the part, and it buys ordered
# output, timestamps and module names. Worth it here specifically because this
# node has NO SHELL: the console is its only diagnostic channel, so making that
# channel trustworthy is not a luxury. Both numbers below are trimmed from their
# 1024 B defaults; raise them if messages start being dropped.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=512
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=768

CONFIG_MAIN_STACK_SIZE=1536

# Deliberately absent: CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE, left at its 1024 B
# default. Worth knowing where it matters, though -- isotp.c drives every
# segmented transfer from k_work_submit(), which is the *shared* system
# workqueue, so the frame-by-frame half of an ISO-TP send runs on that stack
# rather than on main's. If the link ever misbehaves in ways that look like
# memory corruption, this is the first number to raise, and
# CONFIG_THREAD_ANALYZER is how to find out rather than guess.
